# This workflow builds and pushes a Docker image for custom Edubadges (impierce/ssi-agent).
# It is designed for deployment to the SDP (SURF Development Platform) container registry.
# No other checks (tests, linting, etc.) are performed here—these are expected to be handled upstream.
# 
# Required secrets:
#   - CR_SURF_USERNAME: Username for cr.surf.nl registry
#   - CR_SURF_PASSWORD: Password for cr.surf.nl registry
#
# Docker image tags:
#   - latest: Always pushed on edubadges branch or tag
#   - <version>: Extracted from Cargo.toml (e.g., 1.2.3 → cr.surf.nl/impierce/ssi-agent:1.2.3)
#   - git-tag-<tag>: If a git tag is present (e.g., v1.2.3 → cr.surf.nl/impierce/ssi-agent:git-tag-v1.2.3)
#
# Example:
#   - On push to edubadges: tags 'latest' and '<version>' are pushed
#   - On push of tag 'v1.2.3': tags 'latest', '<version>', and 'git-tag-v1.2.3' are pushed
#
# NOTE: This workflow uses Dockerfile.dev for building the image, as required for development and SDP compatibility.

name: Build and Push Docker Image

on:
  push:
    branches: [edubadges]
    tags: ["*"]
  pull_request:
    branches: [edubadges]

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to SDP Container Registry "Harbor"
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: cr.surf.nl
          username: ${{ secrets.CR_SURF_USERNAME }}
          password: ${{ secrets.CR_SURF_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract version from Cargo.toml
        id: version
        run: echo "VERSION=$(cargo read-manifest --manifest-path agent_application/Cargo.toml | jq -r '.version')" >> $GITHUB_OUTPUT

      - name: Get Git tag if available
        id: git_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "GIT_TAG=git-tag-${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "HAS_TAG=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_TAG=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./agent_application/docker/Dockerfile.dev  # Use Dockerfile.dev for SDP/development builds
          tags: |
            cr.surf.nl/edubadges-edubadges/edubadges/ssi-agent:latest
            cr.surf.nl/edubadges-edubadges/edubadges/ssi-agent:${{ steps.version.outputs.VERSION }}
            ${{ steps.git_tag.outputs.HAS_TAG == 'true' && format('cr.surf.nl/edubadges-edubadges/edubadges/ssi-agent:{0}', steps.git_tag.outputs.GIT_TAG) || '' }}
