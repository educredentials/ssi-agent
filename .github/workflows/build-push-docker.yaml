# This workflow builds and pushes a Docker image for custom Edubadges (impierce/ssi-agent).
# It is designed for deployment to the SDP (SURF Development Platform) container registry.
# No other checks (tests, linting, etc.) are performed here—these are expected to be handled upstream.
# 
# Required secrets:
#   - CR_SURF_USERNAME: Username for cr.surf.nl registry
#   - CR_SURF_PASSWORD: Password for cr.surf.nl registry
#
# Docker image tags:
#   - Development builds (branch): 'latest' and '<version>' from Cargo.toml
#   - Release builds (ewi-* tag): Only the git tag (e.g., ewi-1.2.3)
#
# Build variants:
#   - Branch builds: Use Dockerfile.dev (debug build for development/SDP)
#   - Tag builds (ewi-*): Use Dockerfile (release build for production)
#
# Example:
#   - On push to edubadges: tags 'latest' and '1.2.3' are pushed (debug build)
#   - On push of tag 'ewi-1.2.3': only tag 'ewi-1.2.3' is pushed (release build)

name: Build and Push Docker Image

on:
  push:
    branches: [edubadges]
    tags: ["ewi-*"]
  pull_request:
    branches: [edubadges]

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to SDP Container Registry "Harbor"
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: cr.surf.nl
          username: ${{ secrets.CR_SURF_USERNAME }}
          password: ${{ secrets.CR_SURF_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract version from Cargo.toml
        if: ${{ !startsWith(github.ref, 'refs/tags/ewi-') }}
        id: version
        run: echo "VERSION=$(cargo read-manifest --manifest-path agent_application/Cargo.toml | jq -r '.version')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image (development)
        if: ${{ !startsWith(github.ref, 'refs/tags/ewi-') }}
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./agent_application/docker/Dockerfile.dev
          tags: |
            cr.surf.nl/edubadges-edubadges/edubadges/ssi-agent:latest
            cr.surf.nl/edubadges-edubadges/edubadges/ssi-agent:${{ steps.version.outputs.VERSION }}

      - name: Build and push Docker image (release)
        if: startsWith(github.ref, 'refs/tags/ewi-')
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ./agent_application/docker/Dockerfile  # This Dockerfile uses --release for builds
          tags: |
            cr.surf.nl/edubadges-edubadges/edubadges/ssi-agent:${{ github.ref_name }}